services:
  postgres:
    image: postgres:16-alpine
    container_name: embs-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: embs_portal
    volumes:
      - embs_pgdata:/var/lib/postgresql/data

volumes:
  embs_pgdata:
